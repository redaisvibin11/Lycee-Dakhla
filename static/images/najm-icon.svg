<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Najm AI assistant" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Najm</title>
  <!-- badge -->
  <circle cx="32" cy="32" r="31" fill="#EFE4D3"/>
  <!-- antenna -->
  <line x1="32" y1="17" x2="32" y2="23" stroke="#2A1F1A" stroke-width="2.4" stroke-linecap="round"/>
  <!-- 8-point Moroccan star (najm) -->
  <polygon fill="#E9B44C" stroke="#B5442C" stroke-width="1.3" stroke-linejoin="round"
    points="32,4.5 33.3,7.9 36.6,6.4 35.1,9.7 38.5,11 35.1,12.3 36.6,15.6 33.3,14.1 32,17.5 30.7,14.1 27.4,15.6 28.9,12.3 25.5,11 28.9,9.7 27.4,6.4 30.7,7.9"/>
  <!-- ears -->
  <circle cx="11" cy="38" r="3.4" fill="#2A1F1A"/>
  <circle cx="53" cy="38" r="3.4" fill="#2A1F1A"/>
  <!-- head -->
  <rect x="13.5" y="22" width="37" height="32" rx="13" fill="#B5442C"/>
  <!-- face plate -->
  <rect x="18" y="26.5" width="28" height="23" rx="8.5" fill="#F8F0E8"/>
  <!-- eyes -->
  <circle cx="26.5" cy="36.5" r="3.4" fill="#2A1F1A"/>
  <circle cx="37.5" cy="36.5" r="3.4" fill="#2A1F1A"/>
  <circle cx="27.6" cy="35.3" r="1.1" fill="#FFFFFF"/>
  <circle cx="38.6" cy="35.3" r="1.1" fill="#FFFFFF"/>
  <!-- cheeks -->
  <ellipse cx="22.5" cy="43" rx="2.8" ry="1.8" fill="#F3B8AE"/>
  <ellipse cx="41.5" cy="43" rx="2.8" ry="1.8" fill="#F3B8AE"/>
  <!-- smile -->
  <path d="M29 43 Q32 46.2 35 43" fill="none" stroke="#2A1F1A" stroke-width="1.9" stroke-linecap="round"/>
</svg>
